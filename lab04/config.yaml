seed: 42
dataset:
  openml_name: adult
  openml_version: 2
split:
  test_size: 0.30
  stratify: true
validation:
  ranges:
    age: [17, 90]
    hours-per-week: [1, 99]
    capital-gain: [0, 99999]
    capital-loss: [0, 4356]
  missing_token: "?"
cleaning:
  numeric_impute: median
  categorical_impute: most_frequent
  outlier_clip_quantiles: [0.01, 0.99]
  drop_train_duplicates: true
features:
  engineered:
    - capital_net
    - hours_per_age
model:
  type: LogisticRegression
  max_iter: 1000
